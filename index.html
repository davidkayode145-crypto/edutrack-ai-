<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack AI - Covenant University</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function EduTrackApp() {
      const [level, setLevel] = useState('100');
      const [tab, setTab] = useState('courses');

      const courses = {
        '100': [
          { code: 'GST111', title: 'Communication in English I', units: 2, college: 'Core' },
          { code: 'GST121', title: 'Communication in English II', units: 2, college: 'Core' },
          { code: 'GST122', title: 'Nigerian Peoples and Culture', units: 2, college: 'Core' },
          { code: 'TMC111', title: 'Total Man Concept I', units: 1, college: 'Core' },
          { code: 'EDS111', title: 'Entrepreneurship Dev Studies I', units: 1, college: 'Core' },
          { code: 'MAT111', title: 'Algebra & Trigonometry', units: 3, college: 'CST' },
          { code: 'PHY111', title: 'General Physics I', units: 3, college: 'CST' },
          { code: 'CHM111', title: 'General Chemistry I', units: 3, college: 'CST' },
          { code: 'ACC111', title: 'Principles of Accounting I', units: 3, college: 'CMSS' },
          { code: 'ENG101', title: 'Survey of English Language', units: 3, college: 'CLDS' }
        ],
        '200': [
          { code: 'GST211', title: 'Philosophy & Logic', units: 2, college: 'Core' },
          { code: 'GST222', title: 'Peace Studies & Conflict Res.', units: 2, college: 'Core' },
          { code: 'GET207', title: 'Engineering Mathematics I', units: 3, college: 'COE' },
          { code: 'GET201', title: 'Applied Mechanics', units: 3, college: 'COE' },
          { code: 'CSC211', title: 'Data Structures & Algorithms', units: 3, college: 'CST' },
          { code: 'ACC211', title: 'Financial Accounting I', units: 3, college: 'CMSS' },
          { code: 'EEE211', title: 'Circuit Theory I', units: 3, college: 'COE' }
        ],
        '300': [
          { code: 'GST311', title: 'History & Phil. of Science', units: 2, college: 'Core' },
          { code: 'CSC311', title: 'Operating Systems', units: 3, college: 'CST' },
          { code: 'CSC312', title: 'Database Management Systems', units: 3, college: 'CST' },
          { code: 'CPE311', title: 'Microprocessor Systems', units: 3, college: 'COE' },
          { code: 'ACC311', title: 'Management Accounting', units: 3, college: 'CMSS' },
          { code: 'PSI317', title: 'Research Methodology', units: 2, college: 'CMSS' }
        ],
        '400': [
          { code: 'CSC411', title: 'Artificial Intelligence', units: 3, college: 'CST' },
          { code: 'CSC421', title: 'Compiler Construction', units: 3, college: 'CST' },
          { code: 'CSC499', title: 'Final Year Project', units: 6, college: 'CST' },
          { code: 'ACC401', title: 'Advanced Financial Reporting', units: 3, college: 'CMSS' },
          { code: 'GET499', title: 'SIWES Industrial Training', units: 6, college: 'COE' }
        ],
        '500': [
          { code: 'CPE511', title: 'Advanced Computer Architecture', units: 3, college: 'COE' },
          { code: 'CPE521', title: 'Embedded Robotics & Automation', units: 3, college: 'COE' },
          { code: 'EEE511', title: 'Power Systems Engineering', units: 3, college: 'COE' },
          { code: 'ENG599', title: 'Engineering Capstone Project', units: 6, college: 'COE' }
        ]
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6">

          <div className="bg-slate-800 border border-amber-500/30 rounded-2xl p-6 mb-6 text-center shadow-lg">
            <h1 className="text-3xl font-extrabold text-amber-400 mb-1">EduTrack AI</h1>
            <p className="text-slate-300 text-sm">Built for Covenant University Students | Designed by David Kayode</p>
          </div>

          {/* Level Tabs */}
          <div className="flex justify-center space-x-2 mb-6">
            {['100', '200', '300', '400', '500'].map(lvl => (
              <button
                key={lvl}
                onClick={() => setLevel(lvl)}
                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                  level === lvl 
                    ? 'bg-amber-400 text-slate-900 shadow-lg scale-105' 
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                {lvl} Level
              </button>
            ))}
          </div>

          {/* Course List Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {courses[level].map((item, idx) => (
              <div key={idx} className="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow">

                  <span className="bg-amber-400/10 text-amber-400 font-mono font-bold px-2 py-1 rounded text-xs">
                    {item.code}

                  <span className="text-xs text-slate-400">{item.units} Units • {item.college}</span>

                    📄 Cram Sheet
                  </button>
                  <button onClick={() => alert(`Starting Quiz for ${item.code}`)} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg">
                    ✨ Quiz
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EduTrackApp />);
  </script>
</body>
</html>
